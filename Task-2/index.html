<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
   <h1 class="head">Task List</h1>
   <div class="add-task">
        <input type="text" id="task-input" placeholder="Enter task...">
        <button id="add-btn">Add Task</button>
    </div>
    </div>
   <div class="column">

    <div class="column-box">
        <div class="column-title">
            <h2>To Do</h2>
            <button id="todo-button"><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="task" id="todo-list"></div>
        <div class="task-actions"></div>
    </div>

    <div class="column-box">
        <div class="column-title">
            <h2>In Progress</h2>
            <button id="progress-button" ><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="task" id="progress-list"></div>
           <div class="task-actions"></div>
    </div>

    <div class="column-box">
        <div class="column-title">
            <h2>Done</h2>
            <button id="done-button"  ><i class="fa-solid fa-plus"></i></button>
        </div>

        <div class="task" id="done-list"></div>
           <div class="task-actions"></div>
    </div>
</div>
    <script src="./script.js"></script>
</body>
</html>
